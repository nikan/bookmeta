name: ci

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make lint-php
      - run: make test-php

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make install-py
      - run: make lint-py
      - run: make test-py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: make install-ts
      - run: make lint-ts
      - run: make test-ts
      - run: make pack-check-ts
